name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      # D1 の database_id がまだ仮の値なら、公開を飛ばす（docs/SETUP_GUIDE.md の手順 2-2）
      - name: Check config
        id: cfg
        run: |
          if grep -q 'REPLACE_WITH_NEW_D1_ID' wrangler.jsonc; then
            echo "::warning::wrangler.jsonc の database_id が未設定のため、公開を飛ばしました（docs/SETUP_GUIDE.md の手順 2-2）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci
      - if: steps.cfg.outputs.ready == 'true'
        run: npx vite build
      - if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply motteinai --remote
      - if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler deploy
      # GitHub のシークレットを Worker のシークレットへ反映する（値はログに出ない）
      - name: Sync Worker secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET が未登録のため、Google ログインの設定を飛ばしました（docs/SETUP_GUIDE.md の手順 4）"
            exit 0
          fi
          node -e 'require("fs").writeFileSync("secrets.json", JSON.stringify({GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET}))'
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
